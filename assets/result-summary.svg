<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="350" viewBox="0 0 1100 350" role="img" aria-labelledby="title desc">
  <title id="title">Final tool abstention results</title><desc id="desc">SFT improves internal and BFCL accuracy, while DPO reaches perfect preference reward accuracy but collapses free-generation act accuracy.</desc>
  <rect width="1100" height="350" rx="18" fill="#0f172a"/><style>.h{font:700 24px system-ui,sans-serif;fill:#f8fafc}.n{font:700 44px system-ui,sans-serif;fill:#60a5fa}.l{font:15px system-ui,sans-serif;fill:#cbd5e1}.c{fill:#1e293b;stroke:#334155;stroke-width:2}.bad{fill:#fb923c}</style>
  <text class="h" x="40" y="48">What the experiments actually showed</text>
  <rect class="c" x="40" y="80" width="315" height="220" rx="14"/><text class="n" x="65" y="145">94.72%</text><text class="l" x="65" y="178">3-seed SFT internal accuracy</text><text class="l" x="65" y="218">Base: 62.50%</text><text class="l" x="65" y="246">Paired gain: +33.33 points</text><text class="l" x="65" y="274">95% bootstrap CI: +25.00 to +41.67</text>
  <rect class="c" x="392" y="80" width="315" height="220" rx="14"/><text class="n" x="417" y="145">92.08%</text><text class="l" x="417" y="178">3-seed SFT BFCL decision accuracy</text><text class="l" x="417" y="218">BFCL remained evaluation-only</text><text class="l" x="417" y="246">640 non-overlapping records</text><text class="l" x="417" y="274">Held-out internal test stayed sealed</text>
  <rect class="c" x="744" y="80" width="315" height="220" rx="14"/><text class="n bad" x="769" y="145">100% → 0%</text><text class="l" x="769" y="178">DPO reward accuracy → act accuracy</text><text class="l" x="769" y="218">Protocol compliance alone was insufficient</text><text class="l" x="769" y="246">Every preference candidate failed gates</text><text class="l" x="769" y="274">Negative result preserved, not hidden</text>
</svg>
