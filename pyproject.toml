[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "tool-abstention"
version = "0.1.0"
description = "Reproducible training and evaluation for agentic tool abstention"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
authors = [{ name = "Sandeep Satheesh" }]
dependencies = [
  "jsonschema>=4.23,<5",
  "numpy>=2.1,<3",
  "pydantic>=2.10,<3",
  "pyyaml>=6.0.2,<7",
]

[project.scripts]
tool-abstention = "tool_abstention.cli:main"

[dependency-groups]
dev = [
  "mypy>=1.14,<2",
  "pytest>=8.3,<9",
  "pytest-cov>=6,<7",
  "ruff>=0.9,<1",
  "types-jsonschema>=4.23",
  "types-pyyaml>=6.0.12.20241230",
]

[tool.hatch.build.targets.wheel]
packages = ["src/tool_abstention"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers --cov=tool_abstention --cov-report=term-missing --cov-fail-under=95"
testpaths = ["tests"]
